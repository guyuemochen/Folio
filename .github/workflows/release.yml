name: release

# M9 — build, sign, and publish Folio installers + the updater manifest.
#
# Two release channels share this workflow:
#   stable  : push tag v0.x.x            → own Release per version
#   nightly : schedule (daily 03:00 UTC) → own Release per nightly build
#
# Each build publishes its artifacts to its OWN version-tagged GitHub Release
# (e.g. v0.4.0 / nightly-2026-07-30), so the Releases page shows every
# version separately and historical assets never collide.
#
# The Tauri auto-updater, however, reads `latest.json` from a FIXED url
# configured in tauri.conf.json:
#   /releases/download/<channel>-latest/latest.json
# `tauri-apps/tauri-action@v0` cannot publish the installer assets and the
# updater manifest to two different tags in one run, so the manifest is
# handled separately: after tauri-action builds the version-tagged Release,
# the `publish-updater-manifest` job downloads `latest.json` from it and
# re-uploads it to the channel's rolling Release (`stable-latest` /
# `nightly-latest`), moves the rolling git tag to this commit, and strips
# any legacy assets so the rolling Release carries ONLY `latest.json`.
# The download URLs INSIDE `latest.json` still point at the version-tagged
# Release's assets, so clients fetch the correct installer for the newest
# version while the manifest URL stays stable.
#
# Code is hosted on GitLab and mirrored to GitHub; this workflow runs on the
# GitHub mirror so it can publish to GitHub Releases. Set up push mirror in
# GitLab: Settings → Repository → Mirror → push to GitHub mirror repo.
#
# Required GitHub repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY          contents of ~/.tauri/folio-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD empty (dev key has no password; set if
#                                      you regenerate with a password)
# Optional, for OS-level signing once Q11 is resolved:
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET (Windows Authenticode)

on:
  push:
    tags:
      - 'v*'           # stable (v0.1.0, v0.1.1, ...)
      - 'nightly-*'    # explicit nightly tag
  schedule:
    - cron: '0 3 * * *'  # nightly build at 03:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options: ['stable', 'nightly']
        default: 'stable'

# tauri-action creates the per-version GitHub Release + uploads artifacts via
# the REST API using GITHUB_TOKEN. The token needs `contents: write` (and
# `packages: write` if you ever publish anything to GHCR). Without this block
# the token falls back to the repo default, which is read-only on most repos
# → "Resource not accessible by integration" on create-a-release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Resolve channel + tag names
        id: chan
        shell: bash
        run: |
          CH="${{ github.event.inputs.channel || '' }}"
          # Only treat GITHUB_REF as a tag name when this run was actually
          # triggered by a tag push. On schedule/dispatch, GITHUB_REF points
          # at a branch (refs/heads/dev) and the prefix strip would leak the
          # full branch ref into the release name. Guard against that.
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$CH" ]; then
            if [[ "$TAG" == nightly-* ]] || [ "${{ github.event_name }}" = "schedule" ]; then CH=nightly
            else CH=stable; fi
          fi
          ROLLING="$CH-latest"
          DATED="$TAG"
          if [ "$CH" = "nightly" ] && [ -z "$DATED" ]; then
            DATED="nightly-$(date -u +%Y-%m-%d)"
          fi
          echo "channel=$CH"      >> "$GITHUB_OUTPUT"
          echo "rolling=$ROLLING" >> "$GITHUB_OUTPUT"
          echo "dated=$DATED"     >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS / Windows OS-level signing (uncomment once Q11 is resolved):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          # Version-tagged Release (e.g. `v0.4.0`, `nightly-2026-07-30`).
          # Each build creates its own GitHub Release on the real version
          # tag, so every version is visible separately on the Releases
          # page and historical assets never collide. The updater manifest
          # (`latest.json`) generated here is copied to the rolling Release
          # afterwards by the `publish-updater-manifest` job so the updater
          # endpoint in tauri.conf.json keeps working.
          tagName: ${{ steps.chan.outputs.dated }}
          releaseName: '${{ steps.chan.outputs.dated }} (${{ steps.chan.outputs.channel }})'
          releaseBody: 'Folio ${{ steps.chan.outputs.channel }} build ${{ steps.chan.outputs.dated }}'
          releaseDraft: false
          prerelease: ${{ steps.chan.outputs.channel != 'stable' }}
          args: ${{ matrix.args }}

  publish-updater-manifest:
    # tauri-action now publishes every build to its OWN version-tagged
    # Release (v0.4.0, nightly-2026-07-30, ...). The Tauri updater, however,
    # is hardcoded (in tauri.conf.json) to read `latest.json` from the
    # channel's rolling tag:
    #   /releases/download/<channel>-latest/latest.json
    # This job keeps that endpoint alive: after all matrix builds succeed it
    # (1) moves the rolling git tag (`stable-latest` / `nightly-latest`) to
    # this commit, (2) ensures a rolling Release exists for that tag, and
    # (3) copies `latest.json` from the just-built version Release into the
    # rolling Release — overwriting any previous copy and stripping legacy
    # assets so the rolling Release carries ONLY `latest.json`. The download
    # URLs inside `latest.json` still point at the version-tagged assets, so
    # clients fetch the right installer.
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve channel + tag names
        id: chan
        shell: bash
        run: |
          CH="${{ github.event.inputs.channel || '' }}"
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$CH" ]; then
            if [[ "$TAG" == nightly-* ]] || [ "${{ github.event_name }}" = "schedule" ]; then CH=nightly
            else CH=stable; fi
          fi
          ROLLING="$CH-latest"
          DATED="$TAG"
          if [ "$CH" = "nightly" ] && [ -z "$DATED" ]; then
            DATED="nightly-$(date -u +%Y-%m-%d)"
          fi
          echo "channel=$CH"      >> "$GITHUB_OUTPUT"
          echo "rolling=$ROLLING" >> "$GITHUB_OUTPUT"
          echo "dated=$DATED"     >> "$GITHUB_OUTPUT"

      - name: Move rolling git tag to this build's commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          ROLLING="${{ steps.chan.outputs.rolling }}"
          SHA="${{ github.sha }}"
          # PATCH moves an existing lightweight tag. Fall back to POST (create)
          # the first time a channel's rolling tag does not exist yet.
          if ! gh api -X PATCH "repos/$REPO/git/refs/tags/$ROLLING" -f sha="$SHA"; then
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$ROLLING" -f sha="$SHA"
          fi

      - name: Copy latest.json to the rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          ROLLING="${{ steps.chan.outputs.rolling }}"
          DATED="${{ steps.chan.outputs.dated }}"
          CH="${{ steps.chan.outputs.channel }}"
          SHA="${{ github.sha }}"

          # 1. Download latest.json from the just-built version Release.
          gh release download "$DATED" --repo "$REPO" --pattern "latest.json" --clobber
          test -s latest.json || { echo "ERROR: latest.json missing from $DATED" >&2; exit 1; }

          # 2. Ensure the rolling Release exists. Use `gh release view` (reliable
          #    0/1 exit code) instead of `gh api ... --jq '.id // empty'` — the
          #    latter can leak the 404 JSON body to stdout in some gh versions
          #    (cli/cli#10797), so RID captures the whole error body, the
          #    `[ -z "$RID" ]` guard passes, the create-release POST is skipped,
          #    and every later `releases/$RID` call becomes
          #    `releases/{"message":"Not Found",...}` →
          #    `Get "...": unsupported protocol scheme ""` /
          #    `release not found`. `gh release view` never parses the body
          #    into a variable, so it is immune to that leak.
          if ! gh release view "$ROLLING" --repo "$REPO" >/dev/null 2>&1; then
            PRE_FLAG=""
            if [ "$CH" != "stable" ]; then PRE_FLAG="--prerelease"; fi
            gh release create "$ROLLING" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "$ROLLING" \
              --notes "Auto-updater manifest host for the \`$CH\` channel. Latest build: \`$DATED\`. This release carries ONLY \`latest.json\`; installers live in each version's own release." \
              $PRE_FLAG
          fi

          # 3. Strip any legacy assets — only latest.json belongs on this Release.
          #    (Cleans up the previous single-rolling-release layout where every
          #    version's installer assets piled into the same Release.) Safe now:
          #    the release definitely exists (created above if missing), so the
          #    tag lookup returns 200 and --jq runs on a real release object
          #    instead of a 404 body.
          RID="$(gh api "repos/$REPO/releases/tags/$ROLLING" --jq '.id')"
          for AID in $(gh api "repos/$REPO/releases/$RID" --jq '.assets[] | select(.name!="latest.json") | .id'); do
            gh api -X DELETE "repos/$REPO/releases/assets/$AID" || true
          done

          # 4. Upload latest.json (--clobber replaces any previous copy).
          gh release upload "$ROLLING" latest.json --repo "$REPO" --clobber

          echo "Published latest.json to $ROLLING (release #$RID), pointing clients at $DATED."
