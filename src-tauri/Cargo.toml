[package]
name = "folio"
version = "0.4.1"
description = "Folio — local-first Notion-like desktop note app"
authors = ["Folio"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Plugins feature — filesystem plugin (asset protocol scope for plugin .js
# loading via convertFileSrc) and notify (file watcher for plugin hot reload).
# Debounce is implemented in-house (notify-debouncer-* adds a dep & version
# churn for ~30 lines of timer logic we already need to tune).
tauri-plugin-fs = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
# M5: Import/Export — markdown parse (comrak), html parse (scraper), zip read/write, base64 IPC transfer
comrak = "0.52"
scraper = "0.26"
zip = "2"
base64 = "0.22"
url = "2"
# M10 AI assistant (v2 built-in agent): HTTPS + SSE streaming for LLM providers.
# rustls-tls (not native-tls) avoids OpenSSL on Windows; default-features off
# drops the default native-tls backend so only rustls ships.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures = "0.3"
async-trait = "0.1"

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
